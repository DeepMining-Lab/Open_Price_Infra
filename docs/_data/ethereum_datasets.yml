# Datasets extracted daily from Ethereum Mainnet and published in
# https://files.deepmining.ch/files/ethereum/prices/
#
# One entry per public CSV. Contract addresses are copied from the
# POOL_ADDRESS / CONTRACT_ADDRESS constants of {asset}/scripts/*.py.
# Labels follow the "Available Datasets" table of each {asset}/README.md.
#
# Not listed on purpose: crvusd_weth_curve.csv (Curve crvUSD/WETH), whose
# extraction currently produces an empty file.
#
# `status: inactive` flags pools with no recent swaps; `note` states the last
# observed swap (checked on 2026-09-23).

download_url: https://files.deepmining.ch/files/ethereum/prices/
repo_url: https://github.com/DeepMining-Lab/Open_Price_Infra
api_url: https://github.com/DeepMining-Lab/openprice-api

assets:
  - id: eth
    name: ETH
    label: Ether
    readme: eth/README.md
    datasets:
      - { file: chainlink_eth_usd.csv,          pair: ETH/USD,   source: Chainlink,    contract: "0x5f4ec3df9cbd43714fe2740f5e3616155c5b8419" }
      - { file: eth_usdc_uniswap_v3_005.csv,    pair: ETH/USDC,  source: Uniswap V3,   fee: 0.05%, contract: "0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640" }
      - { file: weth_usdc_uniswap_v2_03.csv,    pair: WETH/USDC, source: Uniswap V2,   fee: 0.3%,  contract: "0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc" }
      - { file: weth_usdt_uniswap_v2_03.csv,    pair: WETH/USDT, source: Uniswap V2,   fee: 0.3%,  contract: "0x0d4a11d5eeaac28ec3f61d100daf4d40471f1852" }

